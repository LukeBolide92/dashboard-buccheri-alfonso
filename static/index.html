<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard di Casa</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif}</style>
</head>
<body class="min-h-screen p-6 text-lg" style="background-image:url('https://th.bing.com/th/id/R.45369cac7770f676761b88c4607e8382?rik=9C0fad6CCjklUA&riu=http%3a%2f%2fgetwallpapers.com%2fwallpaper%2ffull%2f6%2f9%2fe%2f517158.jpg&ehk=%2f0kylz2YF12Mw2Uj9IIZ0IXxRJmWwUtidSyfKaWuWSM%3d&risl=&pid=ImgRaw&r=0');background-size:150%;background-position:center center;">
<div class="max-w-6xl mx-auto">
<header class="bg-slate-900/70 backdrop-blur rounded-2xl shadow-xl p-8 mb-8 flex flex-wrap items-center justify-between gap-4">
<div>
<h1 class="text-3xl font-extrabold text-white">Buccheri Alfonso 🏠</h1>
<p class="text-slate-400">Dashboard di Medea, Luca e Ester</p>
</div>
<div class="text-right">
<div id="live-clock" class="text-3xl font-bold text-slate-200"></div>
<div id="today" class="text-slate-500 text-sm"></div>
</div>
</header>
<main class="grid grid-cols-1 lg:grid-cols-3 gap-6">
<div class="bg-slate-900/70 backdrop-blur rounded-2xl shadow-xl p-6 backdrop-blur rounded-2xl shadow-xl p-6">
<h2 class="text-xl font-bold text-white mb-4">Meteo di Oggi</h2>
<div class="flex items-center gap-4 mb-2">
<div id="weather-icon" class="text-5xl"></div>
<div>
<div id="weather-temp" class="text-3xl font-extrabold text-slate-300"></div>
<div id="weather-city" class="text-slate-500"></div>
</div>
</div>
<div id="weather-desc" class="text-slate-200 mb-4"></div>
<div class="flex gap-6 text-slate-300 text-sm">
<span>💧 <span id="weather-humidity">-</span>%</span>
<span>🌬️ <span id="weather-wind">-</span> km/h</span>
</div>
</div>
<div class="bg-slate-900/70 backdrop-blur rounded-2xl shadow-xl p-6 backdrop-blur rounded-2xl shadow-xl p-6">
<h2 class="text-xl font-bold text-white mb-4">Scadenze di Oggi</h2>
<ul id="deadline-list" class="space-y-2"></ul>
</div>
<div class="bg-slate-900/70 backdrop-blur rounded-2xl shadow-xl p-6 backdrop-blur rounded-2xl shadow-xl p-6">
<h2 class="text-xl font-bold text-white mb-4">Motivi di Preghiera</h2>
<div id="motivo-text" class="text-slate-200 whitespace-pre-wrap leading-relaxed"></div>
</div>
</main>
<div class="max-w-2xl mx-auto mt-6"><div class="bg-slate-900/70 backdrop-blur rounded-2xl shadow-xl p-6 text-center">
<h2 class="text-xl font-bold text-white mb-4">✝️ Versetto del Giorno</h2>
<div id="versetto-text" class="text-slate-200 whitespace-pre-wrap leading-relaxed"></div>
</div></div>
</div>
<script>
function updateClock(){
const n=new Date();
document.getElementById('live-clock').textContent=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')+':'+String(n.getSeconds()).padStart(2,'0');
document.getElementById('today').textContent=new Date().toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
updateClock(); setInterval(updateClock,1000);

fetch('http://localhost:5000/api/weather')
.then(r=>r.json())
.then(d=>{
if(!d) return;
document.getElementById('weather-temp').textContent=(d.temp||'?')+'°C';
document.getElementById('weather-icon').textContent=d.icon||'☁️';
document.getElementById('weather-city').textContent=d.city||'';
document.getElementById('weather-desc').textContent=d.desc||'';
document.getElementById('weather-humidity').textContent=d.humidity||'?';
document.getElementById('weather-wind').textContent=d.wind||'?';
});

fetch('http://localhost:5000/api/calendar-events')
.then(r=>r.json())
.then(events=>{
const ul=document.getElementById('deadline-list');
if(!events||!events.length){ul.innerHTML='<li class="text-slate-500">Nessuna scadenza</li>'; return;}
events.forEach(ev=>{
const li=document.createElement('li');
li.className='bg-slate-800 rounded-lg p-3 shadow-sm flex items-center justify-between gap-3';
li.innerHTML='<div class="flex items-center gap-3"><span class="font-bold text-white">'+(ev.title||'Evento')+'</span><span class="text-slate-400 text-xs">'+(ev.time||'')+'</span></div><span class="text-xs '+(ev.done?'line-through text-amber-600':'text-amber-400')+'">'+(ev.done?'✓':'')+'</span>';
ul.appendChild(li);
});
});

fetch('http://localhost:5000/api/motivi')
.then(r=>r.json())
.then(d=>{
document.getElementById('motivo-text').textContent=d.motivi||'';
});

fetch('http://localhost:5000/api/versetto')
.then(r=>r.json())
.then(d=>{
  const text = d.content || d.text || d.verse?.text || JSON.stringify(d);
  const ref = d.reference || d.passage_id || '';
  document.getElementById('versetto-text').innerHTML='<div class="italic text-xl leading-relaxed text-white/90 font-serif">"' + (text||'') + '"</div><div class="mt-2 text-sm font-semibold text-amber-400 tracking-wide">— ' + (ref||'') + '</div>';
});
</script>
</body>
</html>
